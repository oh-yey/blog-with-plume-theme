name: docs

on:
  # 每当 push 到 main 分支时触发部署
  push:
    branches: [ main ]
  # 手动触发部署
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # “最近更新时间” 等 git 日志相关信息，需要拉取全部提交记录
          fetch-depth: 0
          # 启用并递归拉取子模块
          # submodules: recursive

      - name: Update submodules using token
        env:
          TOKEN: ${{ secrets.TOKEN_GITHUB }}
        run: |
          git submodule set-url docs/markdown https://$TOKEN@github.com/oh-yey/blog.git
          git submodule update --init --recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # Node.js 版本
          node-version: 24
          # 缓存 pnpm 依赖
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.12"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # 构建 VuePress 文档
      - name: Build VuePress site
        run: pnpm docs:build

      # 部署 Cloudflare Pages
      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/.vuepress/dist --project-name=ohyey-net

      # push sitemap
      - name: Push Sitemap
        run: |
          go run script/seo/main.go
